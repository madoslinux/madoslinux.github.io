<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madOS OG Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: #0f1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        /* Glow effects */
        body::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(93, 216, 238, 0.15) 0%, transparent 70%);
        }
        
        body::after {
            content: '';
            position: absolute;
            bottom: -200px;
            left: -200px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(224, 124, 216, 0.12) 0%, transparent 70%);
        }
        
        .logo {
            height: 140px;
            margin-bottom: 20px;
        }
        
        .badge {
            font-family: 'Michroma', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #5dd8ee;
            letter-spacing: 2px;
            margin-bottom: 30px;
            padding: 8px 24px;
            border: 1px solid rgba(93, 216, 238, 0.4);
            border-radius: 50px;
            background: rgba(93, 216, 238, 0.08);
        }
        
        .tagline {
            font-family: 'Michroma', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #e07cd8;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }
        
        .stats {
            display: flex;
            gap: 60px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Michroma', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: #5dd8ee;
            display: block;
        }
        
        .stat-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #a0a8b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        
        /* Border */
        .border {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid #5dd8ee;
            pointer-events: none;
        }
        
        .border::before,
        .border::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #5dd8ee;
        }
        
        .border::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        
        .border::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="border"></div>
    
    <img src="mados-logo.png" alt="madOS" class="logo">
    
    <div class="badge">POWERED BY OLLAMA AND OPENCODE</div>
    
    <div class="tagline">AI-Orchestrated Arch Linux</div>
    
    <div class="stats">
        <div class="stat">
            <span class="stat-value">800MB</span>
            <span class="stat-label">RAM Usage</span>
        </div>
        <div class="stat">
            <span class="stat-value">1.9GB</span>
            <span class="stat-label">Min RAM</span>
        </div>
        <div class="stat">
            <span class="stat-value">100%</span>
            <span class="stat-label">Open Source</span>
        </div>
    </div>
</body>
</html>
